<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="stylesheet" href="app.css"><title>LaterTube</title></head>
<body><header><img src="icon.png" onerror="this.hidden=true"><div><strong>LaterTube</strong><small>Локальный список телефона</small></div></header><main><div class="list-top"><p id="summary"></p><label>Сортировка<select id="sort"><option value="added-newest">Добавлено: сначала новые</option><option value="added-oldest">Добавлено: сначала старые</option><option value="video-newest">Дата видео: сначала новые</option><option value="video-oldest">Дата видео: сначала старые</option><option value="views-most">Просмотры: больше</option><option value="views-least">Просмотры: меньше</option><option value="random">Случайный порядок</option><option value="title">По названию</option><option value="shortest">Сначала короткие</option><option value="longest">Сначала длинные</option></select></label></div><label class="toggle"><input id="remove-on-open" type="checkbox"><span>Удалять при открытии</span></label><div class="tabs" role="tablist" aria-label="Списки видео"><button class="tab active" id="active-tab" type="button" role="tab" aria-selected="true">Список видео <span id="active-count"></span></button><button class="tab" id="deletion-tab" type="button" role="tab" aria-selected="false">К удалению <span id="deletion-count"></span></button></div><section id="list"></section><section id="empty" hidden><h2 id="empty-heading"></h2><p id="empty-text"></p></section></main><script src="app.js"></script></body></html>
